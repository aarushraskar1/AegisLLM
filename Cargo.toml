[package]
name = "aegisllm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local-first defensive reverse proxy for LLM APIs"

[dependencies]
axum = { version = "0.8", features = ["http1", "http2", "json", "tokio"] }
bytes = "1"
dashmap = "6"
futures-util = "0.3"
http = "1"
ort = { version = "2.0.0-rc.10", features = ["load-dynamic"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tokenizers = "0.21"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
