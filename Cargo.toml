[package]
name = "aegisllm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local-first defensive reverse proxy for LLM APIs"

[lib]
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["http1", "http2", "json", "tokio"] }
bytes = "1"
dashmap = "6"
futures-util = "0.3"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
