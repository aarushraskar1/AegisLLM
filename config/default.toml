bind_addr = "127.0.0.1:8080"
upstream_base_url = "https://api.openai.com"
upstream_bearer_token = ""
semantic_cache_enabled = false
similarity_threshold = 0.96
max_cache_entries = 10000
cache_ttl_seconds = 3600
