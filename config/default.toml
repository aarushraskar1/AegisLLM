tokenizer_path = "models/tokenizer.json"
# Set these to the exact SHA-256 checksums of your locally obtained artifacts.
embedding_model_sha256 = ""
tokenizer_sha256 = ""
embedding_max_tokens = 256
dashboard_enabled = false
